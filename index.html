<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ヌマーカステンで足し算 - ピグマリオン</title>
    <link rel="stylesheet" href="numicon-style.css">
</head>
<body>
    <div class="container">
        <div class="game-area">
            <div class="question-section">
                <div class="progress-track" id="progressTrack">
                    <div class="road"></div>
                    <div class="road-markers" id="roadMarkers"></div>
                    <div class="start-label">スタート</div>
                    <div class="goal-label">ゴール</div>
                    <div class="dog" id="dog">🐕</div>
                </div>
                <div class="box-container">
                    <div class="ball-box" id="ballBox">
                        <div class="box-row top-row" id="topRow"></div>
                        <div class="box-row bottom-row" id="bottomRow"></div>
                    </div>
                </div>
                <h2 class="question-text">ぜんぶでいくつ？</h2>
            </div>

            <div class="answer-selector">
                <div class="number-buttons" id="numberButtons"></div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="completion-screen" id="completionScreen" style="display: none;">
                <div class="completion-message" id="completionMessage"></div>
                <button class="btn btn-primary" id="reviewBtn">復習テスト開始</button>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="newQuestionBtn">新しい問題</button>
                <button class="btn btn-secondary" id="showAnswerBtn">答えを見る</button>
            </div>

            <div class="score">
                <p>正解: <span id="correctCount">0</span> / <span id="totalCount">0</span></p>
            </div>
        </div>
    </div>

    <script src="numicon-script.js"></script>
</body>
</html>
